<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe5" />
    <script src="./invitation-early-route.js?v=20261017-prepaint-route-1"></script>
    <title>Administrator Sign-in · QD Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./dashboard.css" />
    <link rel="stylesheet" href="./dashboard-login.css?v=20261002-celebration-login-2" />
    <link rel="stylesheet" href="./admin-login.css?v=20261029-2" />
  </head>
  <body class="dashboard-body planner-login-page admin-login-page">
    <main class="planner-login">
      <div class="planner-login__layout">
        <section class="planner-login__story" aria-labelledby="celebrationTitle">
          <a class="planner-login__brand" href="./" aria-label="QD Events home">
            <span class="planner-login__brand-mark" aria-hidden="true">
              <svg viewBox="0 0 40 40" focusable="false">
                <path d="M20 3.5 23.9 15l11.8-3.4-7.1 10 8.4 8.8-12.1-1.7L20 40l-4.9-11.3L3 30.4l8.4-8.8-7.1-10L16.1 15 20 3.5Z" />
                <circle cx="20" cy="21" r="4.1" />
              </svg>
            </span>
            <span>QD Events</span>
          </a>

          <div class="planner-login__story-copy">
            <p class="planner-login__eyebrow"><span class="admin-login__eyebrow-dot" aria-hidden="true"></span> QD Events workspace</p>
            <h1 id="celebrationTitle">Your events.<br /><em>One clear view.</em></h1>
          </div>

        </section>

        <section class="planner-login__form-side" aria-labelledby="loginTitle">
          <div class="planner-login__card">
            <div class="planner-login__card-heading">
              <p class="planner-login__card-eyebrow" id="loginEyebrow">Administrator access</p>
              <h2 id="loginTitle">Welcome back.</h2>
              <p id="loginDescription">Sign in to manage your events and customer accounts.</p>
            </div>

            <form class="planner-login__form" id="loginForm">
              <label class="planner-login__field" for="loginEmail">
                <span>Email</span>
                <input
                  id="loginEmail"
                  name="email"
                  type="email"
                  inputmode="email"
                  autocomplete="username"
                  placeholder="you@example.com"
                  required
                />
              </label>

              <label class="planner-login__field" for="loginPassword">
                <span>Password</span>
                <span class="planner-login__password-wrap">
                  <input
                    id="loginPassword"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                  />
                  <button
                    class="planner-login__password-toggle"
                    type="button"
                    data-password-toggle
                    aria-label="Show password"
                    aria-pressed="false"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-eye-show>
                      <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z" />
                      <circle cx="12" cy="12" r="2.7" />
                    </svg>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-eye-hide hidden>
                      <path d="m3 3 18 18M10.6 6.2A10.5 10.5 0 0 1 12 6c6.2 0 9.5 6 9.5 6a15 15 0 0 1-3.1 3.7M6.2 6.3C3.8 8 2.5 12 2.5 12s3.3 6 9.5 6c1.1 0 2.1-.2 3-.5" />
                    </svg>
                  </button>
                </span>
              </label>

              <button class="planner-login__submit" type="submit" id="loginSubmitButton">
                <span id="loginSubmitLabel">Sign in</span>
                <svg class="planner-login__spinner" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                  <circle cx="12" cy="12" r="9" />
                </svg>
                <svg class="planner-login__submit-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M5 12h14m-6-6 6 6-6 6" />
                </svg>
              </button>
            </form>

            <p class="planner-login__status" id="authStatus" role="status" aria-live="polite" aria-atomic="true"></p>
            <div class="planner-login__card-footer">
              <svg class="planner-login__footer-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 2.5c2.3 3.6 4.1 5.4 9.5 9.5-5.4 4.1-7.2 5.9-9.5 9.5-2.3-3.6-4.1-5.4-9.5-9.5 5.4-4.1 7.2-5.9 9.5-9.5Z" />
                <circle cx="12" cy="12" r="1.6" />
              </svg>
              <span>Your event workspace, all in one place.</span>
            </div>
          </div>
          <p class="planner-login__form-note"><a href="./customer-login.html">Customer sign-in</a></p>
        </section>
      </div>
    </main>

    <script type="module" src="./dashboard-login.js?v=20261017-customer-access-1"></script>
  </body>
</html>
