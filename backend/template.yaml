AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Photo Bucket backend. ONE shared stack hosting many isolated buckets. Data resources are retained if the stack is deleted.
Parameters:
  Stage:
    Type: String
    Default: shared
    AllowedPattern: '^[a-z0-9-]{3,20}$'
    Description: Separates resource names, for example shared or staging.
  FirebaseProjectId: { Type: String }
  AdminUids:
    Type: String
    Description: Comma-separated Firebase UIDs of the platform admins. Only they can create buckets, set size, change owners or delete.
  AllowedOrigin:
    Type: CommaDelimitedList
    Description: Website origin(s) allowed to call the API, comma-separated.
  BackupBucketName: { Type: String }
  BackupRegion: { Type: String }
  # From the AWS load test: five large events at once peaked at about 190 requests a second (11,153 a minute), so 1500
  # leaves about 8x headroom. At 0.12 to 0.15 s a request it needs roughly 200 to 450 concurrent functions, which keeps
  # the API under a 1,000 account Lambda limit; at 3000 the 4,000-device run hit that limit before API Gateway stopped it.
  # The API function is deliberately not reserved, so it can use whatever the account has free.
  ApiRateLimit: { Type: Number, Default: 1500 }
  ApiBurstLimit: { Type: Number, Default: 3000 }
  # Backups lag at peak on purpose: originals are already safe and the queue holds the backlog for 14 days.
  BackupMaxConcurrency: { Type: Number, Default: 50, MinValue: 2 }
  AlarmTopicArn:
    Type: String
    AllowedPattern: '^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:.+$'
    Description: SNS topic every alarm notifies. Required, so a failed backup always reaches someone.
  # Provisional until the load test. Normal use is a few guest deletes a minute even in a busy room.
  PhotoPurgeAlarmThreshold: { Type: Number, Default: 1000, Description: Guest photo purges in 5 minutes that raise the delete-volume alarm. }
Resources:
  # RetainExceptOnCreate: if the very first deploy fails, rollback removes these (they hold no data yet) so a redeploy is
  # not blocked by leftovers. Once created they are retained like Retain. Deletion protection on the table is switched on
  # by deploy.sh right after a successful deploy, because a protected table would make that rollback fail.
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'pbs-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
        - { AttributeName: gsi3pk, AttributeType: S }
        - { AttributeName: gsi3sk, AttributeType: S }
        - { AttributeName: gsi4pk, AttributeType: S }
        - { AttributeName: gsi4sk, AttributeType: S }
      KeySchema: [{ AttributeName: pk, KeyType: HASH }, { AttributeName: sk, KeyType: RANGE }]
      GlobalSecondaryIndexes:
        # Buckets by owner uid, all buckets for admins, photos by contributor.
        - IndexName: GSI1
          KeySchema: [{ AttributeName: gsi1pk, KeyType: HASH }, { AttributeName: gsi1sk, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
        # Sparse: demos by expiry, buckets an admin deleted, photos without a backup yet.
        - IndexName: GSI2
          KeySchema: [{ AttributeName: gsi2pk, KeyType: HASH }, { AttributeName: gsi2sk, KeyType: RANGE }]
          Projection: { ProjectionType: INCLUDE, NonKeyAttributes: [imageKey] }
        # Sparse: every failed backup across all buckets, for the admin overview.
        - IndexName: GSI3
          KeySchema: [{ AttributeName: gsi3pk, KeyType: HASH }, { AttributeName: gsi3sk, KeyType: RANGE }]
          Projection: { ProjectionType: KEYS_ONLY }
        # Every live photo of a bucket in upload time order, for the gallery's newest or oldest first pages.
        - IndexName: GSI4
          KeySchema: [{ AttributeName: gsi4pk, KeyType: HASH }, { AttributeName: gsi4sk, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  # Survives redeploys, so guests keep their identity. Generated by AWS: it is never in this repo or in deploy output.
  GuestTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }
  PhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    DependsOn: BackupQueuePolicy
    Properties:
      BucketName: !Sub 'pbs-${Stage}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      VersioningConfiguration: { Status: Enabled }
      CorsConfiguration:
        CorsRules: [{ AllowedOrigins: !Ref AllowedOrigin, AllowedMethods: [PUT, GET], AllowedHeaders: ['*'], MaxAge: 3000 }]
      LifecycleConfiguration:
        Rules:
          - { Id: expire-unfinished-uploads, Status: Enabled, Prefix: incoming/, ExpirationInDays: 1, NoncurrentVersionExpiration: { NoncurrentDays: 1 } }
          - { Id: expire-unfinished-song-uploads, Status: Enabled, Prefix: audio/__uploads__/, ExpirationInDays: 1, NoncurrentVersionExpiration: { NoncurrentDays: 1 } }
          # Originals of deleted photos and old versions expire here, 30 days after being hidden. Backups live in another bucket.
          - { Id: expire-old-versions, Status: Enabled, NoncurrentVersionExpiration: { NoncurrentDays: 30 }, ExpiredObjectDeleteMarker: true, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 } }
      # Copy only: commits and restores copy into place, while browsers PUT to incoming/. Thumbnails do not end in .jpg.
      NotificationConfiguration:
        QueueConfigurations:
          - Event: 's3:ObjectCreated:Copy'
            Queue: !GetAtt BackupQueue.Arn
            Filter: { S3Key: { Rules: [{ Name: prefix, Value: buckets/ }, { Name: suffix, Value: .jpg }] } }
  BackupDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'pbs-${Stage}-backup-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  BackupQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'pbs-${Stage}-backup'
      MessageRetentionPeriod: 1209600
      DelaySeconds: 30 # lets the commit transaction finish before its S3 event is handled
      VisibilityTimeout: 720 # 6 x the backup function's timeout
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt BackupDlq.Arn, maxReceiveCount: 5 }
  BackupQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref BackupQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt BackupQueue.Arn
            Condition:
              ArnLike: { 'aws:SourceArn': !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}' }
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
  BackupDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A photo could not be backed up after 5 attempts. See backend/README.md, Backups.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt BackupDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
  # 30 days, for abuse and fault diagnosis. Holds source addresses and paths, never query strings or headers.
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
  # HTTP APIs publish no throttle metric, so 429s are counted from the access log. This includes the mint limits.
  Api429Metric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiAccessLogs
      FilterPattern: '{ $.status = 429 }'
      MetricTransformations: [{ MetricNamespace: !Sub 'PhotoBucket/${Stage}', MetricName: Api429, MetricValue: '1', DefaultValue: 0 }]
  Api429Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API requests are being throttled or rate limited. Check the access log for which route.
      Namespace: !Sub 'PhotoBucket/${Stage}'
      MetricName: Api429
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
  # Includes 503 BUSY and the friendly 503 of a frozen bucket, so a frozen bucket with visitors can raise it too.
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API is answering 5xx.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref Api }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
  ApiFunctionThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API function hit the account's Lambda concurrency limit.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
  PhotoPurgeVolumeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Unusually many permanent photo deletes. Possible bug or misuse of the API role.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref PhotoPurgeFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref PhotoPurgeAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigin
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
      DefaultRouteSettings: { ThrottlingBurstLimit: !Ref ApiBurstLimit, ThrottlingRateLimit: !Ref ApiRateLimit }
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":$context.status,"responseLength":"$context.responseLength","latency":"$context.integrationLatency","error":"$context.integrationErrorMessage"}'
      # Across all buckets, before any function runs or any table write happens. Per-bucket limits are in the handler.
      RouteSettings:
        'POST /b/{bucketId}/guest': { ThrottlingBurstLimit: 400, ThrottlingRateLimit: 200 }
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512 # commit reads headers only; photo bytes never enter this function
      Timeout: 29
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          PHOTO_BUCKET: !Sub 'pbs-${Stage}-${AWS::AccountId}-${AWS::Region}'
          BACKUP_BUCKET: !Ref BackupBucketName
          BACKUP_REGION: !Ref BackupRegion
          FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
          GUEST_TOKEN_SECRET: !Sub '{{resolve:secretsmanager:${GuestTokenSecret}:SecretString}}'
          ADMIN_UIDS: !Ref AdminUids
          PHOTO_PURGE_FUNCTION: !Ref PhotoPurgeFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            # No version deletion here: delete markers only. Permanent guest deletes go through PhotoPurgeFunction below.
            - { Effect: Allow, Action: [s3:GetObject, s3:PutObject, s3:DeleteObject], Resource: !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}/*' }
            # ListBucket makes a missing key answer 404 rather than 403.
            - { Effect: Allow, Action: [s3:ListBucket], Resource: !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}' }
            # Event songs only: replacing or deleting a song removes every version of it. Never photos or backups.
            - { Effect: Allow, Action: [s3:DeleteObjectVersion], Resource: !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}/audio/*' }
            - Effect: Allow
              Action: [s3:ListBucketVersions]
              Resource: !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}'
              Condition: { StringLike: { 's3:prefix': ['audio/*'] } }
            # Backups: read only, to restore one.
            - { Effect: Allow, Action: [s3:GetObject], Resource: !Sub 'arn:aws:s3:::${BackupBucketName}/*' }
            - { Effect: Allow, Action: [s3:ListBucket], Resource: !Sub 'arn:aws:s3:::${BackupBucketName}' }
            - { Effect: Allow, Action: [lambda:InvokeFunction], Resource: !GetAtt PhotoPurgeFunction.Arn }
      Events:
        Any: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/{proxy+}', Method: ANY } }
        GuestMint: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: '/b/{bucketId}/guest', Method: POST } }
  BackupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/backup.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 2048
      Timeout: 120
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          PHOTO_BUCKET: !Sub 'pbs-${Stage}-${AWS::AccountId}-${AWS::Region}'
          BACKUP_BUCKET: !Ref BackupBucketName
          BACKUP_REGION: !Ref BackupRegion
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            # DeleteObject hides the original of a photo deleted before its backup finished.
            - { Effect: Allow, Action: [s3:GetObject, s3:DeleteObject], Resource: !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}/*' }
            - { Effect: Allow, Action: [s3:ListBucket], Resource: !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}' }
            # DeleteObjectVersion removes a copy that landed after a guest's delete.
            - { Effect: Allow, Action: [s3:PutObject], Resource: !Sub 'arn:aws:s3:::${BackupBucketName}/*' }
            - { Effect: Allow, Action: [s3:DeleteObjectVersion], Resource: !Sub 'arn:aws:s3:::${BackupBucketName}/buckets/*/backup/*' }
            - { Effect: Allow, Action: [s3:ListBucketVersions], Resource: !Sub 'arn:aws:s3:::${BackupBucketName}' }
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt BackupQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: !Ref BackupMaxConcurrency }
  # Permanent delete of one guest photo, invoked synchronously by the API with a tombstone id only. It checks the table
  # before acting, and cannot write to it. The only function the API can use to destroy data.
  PhotoPurgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/photo-purge.handler
      # It reached 81 at once in a purge storm on the load test and only failed because of S3. 20 caps that storm and
      # keeps it from taking concurrency the API needs; a waiting purge is retried by the sweep.
      ReservedConcurrentExecutions: 20
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          PHOTO_BUCKET: !Sub 'pbs-${Stage}-${AWS::AccountId}-${AWS::Region}'
          BACKUP_BUCKET: !Ref BackupBucketName
          BACKUP_REGION: !Ref BackupRegion
      Policies:
        - Statement:
            - { Effect: Allow, Action: [dynamodb:GetItem], Resource: !GetAtt Table.Arn }
            - Effect: Allow
              Action: [s3:ListBucketVersions]
              Resource: [!Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}', !Sub 'arn:aws:s3:::${BackupBucketName}']
              Condition: { StringLike: { 's3:prefix': ['buckets/*', 'incoming/*'] } }
            - Effect: Allow
              Action: [s3:DeleteObjectVersion]
              Resource:
                - !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}/buckets/*/photos/*'
                - !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}/incoming/*'
                - !Sub 'arn:aws:s3:::${BackupBucketName}/buckets/*/backup/*'
  # Demo cleanup. This role is the structural guarantee: table keys, S3 objects and listings are all limited to
  # demo-* ids, so it cannot read or delete a non-demo bucket whatever its code does.
  DemoSweepFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/sweep.demoHandler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 840
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          PHOTO_BUCKET: !Sub 'pbs-${Stage}-${AWS::AccountId}-${AWS::Region}'
          BACKUP_BUCKET: !Ref BackupBucketName
          BACKUP_REGION: !Ref BackupRegion
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem]
              Resource: !GetAtt Table.Arn
              Condition: { 'ForAllValues:StringLike': { 'dynamodb:LeadingKeys': ['BUCKET#demo-*'] } }
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !Sub '${Table.Arn}/index/GSI2'
              Condition: { 'ForAllValues:StringLike': { 'dynamodb:LeadingKeys': ['DEMO'] } }
            - Effect: Allow
              Action: [s3:ListBucketVersions]
              Resource: [!Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}', !Sub 'arn:aws:s3:::${BackupBucketName}']
              Condition: { StringLike: { 's3:prefix': ['buckets/demo-*', 'incoming/demo-*'] } }
            - Effect: Allow
              Action: [s3:DeleteObject, s3:DeleteObjectVersion]
              Resource:
                - !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}/buckets/demo-*'
                - !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}/incoming/demo-*'
                - !Sub 'arn:aws:s3:::${BackupBucketName}/buckets/demo-*'
                - !Sub 'arn:aws:s3:::${BackupBucketName}/incoming/demo-*'
      Events:
        Schedule: { Type: Schedule, Properties: { Schedule: 'rate(15 minutes)' } }
  # Purges buckets an admin deleted through the API, repeats guest-photo purges, and reconciles interrupted song writes.
  AdminSweepFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/sweep.adminHandler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 840
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          PHOTO_BUCKET: !Sub 'pbs-${Stage}-${AWS::AccountId}-${AWS::Region}'
          BACKUP_BUCKET: !Ref BackupBucketName
          BACKUP_REGION: !Ref BackupRegion
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:DeleteItem, dynamodb:BatchWriteItem]
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !Sub '${Table.Arn}/index/GSI2'
              Condition: { 'ForAllValues:StringLike': { 'dynamodb:LeadingKeys': ['PURGE', 'PHOTOPURGE', 'SONGCLEANUP'] } }
            - Effect: Allow
              Action: [dynamodb:UpdateItem]
              Resource: !GetAtt Table.Arn
              Condition: { 'ForAllValues:StringLike': { 'dynamodb:LeadingKeys': ['EVENT#*'] } }
            - Effect: Allow
              Action: [s3:ListBucketVersions]
              Resource: [!Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}', !Sub 'arn:aws:s3:::${BackupBucketName}']
            - Effect: Allow
              Action: [s3:DeleteObject, s3:DeleteObjectVersion]
              Resource:
                - !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}/buckets/*'
                - !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}/incoming/*'
                - !Sub 'arn:aws:s3:::pbs-${Stage}-${AWS::AccountId}-${AWS::Region}/audio/*'
                - !Sub 'arn:aws:s3:::${BackupBucketName}/buckets/*'
      Events:
        Schedule: { Type: Schedule, Properties: { Schedule: 'rate(5 minutes)' } }
Outputs:
  ApiUrl: { Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com' }
  PhotoBucketName: { Value: !Sub 'pbs-${Stage}-${AWS::AccountId}-${AWS::Region}' }
  TableName: { Value: !Ref Table }
  BackupDlqUrl: { Value: !Ref BackupDlq }
