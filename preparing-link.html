<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Preparing your link · qdsystems</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f6f5ef; color: #263a32; font: 15px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 36px 30px; text-align: center; background: #fffefa; border: 1px solid #e6dfd2; border-radius: 20px; box-shadow: 0 12px 32px rgba(41, 53, 47, .06); }
      .brand { margin: 0 0 28px; color: #1f5a4d; font-weight: 800; font-size: 12px; letter-spacing: .14em; }
      .spinner { width: 34px; height: 34px; margin: 0 auto 20px; border: 3px solid #e0ece5; border-top-color: #1f5a4d; border-radius: 50%; animation: spin .9s linear infinite; }
      h1 { margin: 0; font-size: 1.2rem; line-height: 1.3; } p { margin: 10px 0 0; color: #65736b; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <p class="brand">QDSYSTEMS</p>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Preparing your link</h1>
      <p>This page will open automatically in a moment.</p>
    </main>
  </body>
</html>
