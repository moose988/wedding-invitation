<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customers · qdsystems</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./weddings.css"><link rel="stylesheet" href="./customers.css?v=20261029-password-confirm"><link rel="stylesheet" href="./password-visibility.css?v=1"></head>
<body class="weddings-body"><main class="weddings-shell" id="workspace" hidden><header class="workspace-header"><a class="workspace-brand" href="./all-events.html">qdsystems</a><div class="workspace-account"><span id="userEmail"></span><button class="text-button" id="signOut" type="button">Sign out</button></div></header>
<nav class="workspace-tabs" aria-label="Workspace"><a href="./all-events.html">All Events</a><a class="is-active" aria-current="page" href="./customers.html">Customers</a></nav>
<section class="workspace-hero customer-hero"><div><h1>Customers</h1><p>Manage customer accounts and the events they can access.</p></div><button class="primary-button" id="addCustomer" type="button">+ Add customer</button></section>
<section class="workspace-controls"><label class="search-field"><span class="sr-only">Search customers</span><input id="search" type="search" placeholder="Search by customer email or event"></label></section><p class="workspace-status" id="status" role="status">Loading customers…</p><div id="customerList" class="customer-list"></div>
</main><section class="workspace-loading" id="loading" role="status">Loading workspace…</section>
<dialog id="customerDialog" class="workspace-dialog"><form id="customerForm" class="workspace-modal workspace-modal--small"><header><h2>Add customer</h2><button class="icon-close" type="button" data-close aria-label="Close">×</button></header><div class="workspace-modal__body customer-form"><label>Account<select name="account"><option value="new">Create a new account</option></select></label><label id="emailLabel">Email address<input name="email" type="email" autocomplete="off" required></label><div id="passwordLabel" class="password-visibility-field"><label for="initialCustomerPassword">Initial password</label><div class="password-visibility"><input id="initialCustomerPassword" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required><button type="button" class="password-visibility__toggle" data-visibility-toggle="initial password" aria-label="Show initial password" aria-pressed="false">Show</button></div></div><label>Assign to event<select name="event" required><option value="">Select an event</option></select></label><p class="form-error" role="alert"></p></div><footer><button class="secondary-button" type="button" data-close>Cancel</button><button class="primary-button" type="submit">Save customer</button></footer></form></dialog>
<dialog id="passwordDialog" class="workspace-dialog"><form id="passwordForm" class="workspace-modal workspace-modal--small"><header><h2>Change password</h2><button class="icon-close" type="button" data-close aria-label="Close">×</button></header><div class="workspace-modal__body customer-form"><p id="passwordFor"></p><label for="newCustomerPassword">New password</label><div class="password-input"><input id="newCustomerPassword" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required><button type="button" class="password-toggle" data-password-toggle="newCustomerPassword" aria-label="Show new password" aria-pressed="false">Show</button></div><label for="confirmCustomerPassword">Confirm password</label><div class="password-input"><input id="confirmCustomerPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" required><button type="button" class="password-toggle" data-password-toggle="confirmCustomerPassword" aria-label="Show confirmation password" aria-pressed="false">Show</button></div><p class="form-error" role="alert"></p></div><footer><button class="secondary-button" type="button" data-close>Cancel</button><button class="primary-button" type="submit">Change password</button></footer></form></dialog>
<dialog id="deleteDialog" class="workspace-dialog"><form id="deleteForm" class="workspace-modal workspace-modal--small"><header><h2>Delete customer?</h2><button class="icon-close" type="button" data-close aria-label="Close">×</button></header><div class="workspace-modal__body"><p id="deleteFor"></p><p>This deletes the sign-in account and removes access to all its events. The events themselves will remain.</p><p class="form-error" role="alert"></p></div><footer><button class="secondary-button" type="button" data-close>Cancel</button><button class="danger-button" type="submit">Delete account</button></footer></form></dialog><script type="module" src="./customers.js?v=20261029-all-passwords"></script></body></html>
